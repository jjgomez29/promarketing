services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: promarketing_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - promarketing
    depends_on:
      db:
        condition: service_healthy
      node:
        condition: service_completed_successfully

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: promarketing_node
    working_dir: /var/www
    volumes:
      - .:/var/www
      - node_modules:/var/www/node_modules
    networks:
      - promarketing

  nginx:
    image: nginx:1.27-alpine
    container_name: promarketing_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - promarketing
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: promarketing_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-promarketing}
      MYSQL_USER: ${DB_USERNAME:-promarketing}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - promarketing
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  promarketing:
    driver: bridge

volumes:
  db_data:
  node_modules:
